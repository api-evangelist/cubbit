apis:
- name: Cubbit DS3 S3-Compatible API
  description: >-
    The AWS S3-compatible object storage API for Cubbit DS3. Supports bucket
    create/delete/list, object upload/download/copy/delete, multipart upload,
    object versioning, object lock (COMPLIANCE and GOVERNANCE retention plus
    legal hold), and object tagging. Authenticated with access key ID and
    secret access key using AWS Signature Version 4 against the s3.cubbit.eu
    endpoint (region eu-west-1); custom tenants use s3.<tenant>.cubbit.eu.
  humanURL: https://docs.cubbit.io/guides/s3-api
  baseURL: https://s3.cubbit.eu
