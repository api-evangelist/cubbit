aid: cubbit
name: Cubbit
description: >-
  Cubbit is a European cloud storage provider offering DS3, a sovereign,
  geo-distributed, S3-compatible object storage platform. DS3 encrypts
  (AES-256), fragments, and replicates data across multiple user-selected
  locations using Reed-Solomon erasure coding, delivering geo-resilience
  and data sovereignty within Europe. It ships in two forms: DS3 Cloud, a
  ready-to-use managed geo-redundant object store (TBs to PBs), and DS3
  Composer, self-hosted software-defined storage you run on your own
  hardware (200 TB+). The storage plane exposes an AWS S3-compatible API at
  https://s3.cubbit.eu (region eu-west-1), authenticated with access key /
  secret key and AWS Signature Version 4, so existing S3 SDKs, the AWS CLI,
  rclone, Cyberduck, Veeam and other S3 tooling work unchanged. Cubbit is
  certified to ISO/IEC 27001, 27017, 27018, 9001, 20000-1 and 22301, and is
  GDPR- and NIS2-aligned with Italian ACN PA Cloud qualification.
