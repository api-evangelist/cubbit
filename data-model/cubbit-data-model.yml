entities:
- name: Project
  description: Console-level tenant grouping that owns access keys and buckets.
- name: AccessKey
  description: Access key ID + secret access key pair used for AWS SigV4 auth; created per project.
- name: Bucket
  description: Top-level container for objects; supports versioning and object lock.
- name: Object
  description: A stored object (key + data + metadata) within a bucket.
- name: ObjectVersion
  description: A specific version of an object when bucket versioning is enabled.
- name: ObjectTag
  description: Key/value tag attached to an object (PutObjectTagging).
- name: ObjectLock
  description: Retention (COMPLIANCE/GOVERNANCE) and legal-hold state on an object version.
